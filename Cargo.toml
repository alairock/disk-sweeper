[package]
name = "disk-sweeper"
version = "0.1.0"
edition = "2021"
description = "A desktop app for macOS and Windows that shows what's using your disk (treemap, biggest files) and cleans caches, logs and the Trash."
license = "MIT OR Apache-2.0"
repository = "https://github.com/alairock/disk-sweeper"
readme = "README.md"
keywords = ["disk-usage", "treemap", "cleanup", "egui", "storage"]
categories = ["filesystem", "gui"]

[[bin]]
name = "disk-sweeper"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.26.2", default-features = false, features = ["glow", "default_fonts"] }
egui = "=0.26.2"
winit = "=0.29.15"
rayon = "1.10"
image = { version = "=0.24.9", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.153"

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.58"
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[profile.release]
opt-level = 3
strip = true

# winit 0.29's macOS bindings trip an over-strict debug-only type check on newer macOS.
[profile.dev.package.objc2]
debug-assertions = false
[profile.dev.package.icrate]
debug-assertions = false
